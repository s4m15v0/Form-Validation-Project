<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Form Validation with Regex</title>
</head>

<body>

    <div class="container">
        <div class="bg-dark text-dark p-5 rounded-sm">
            <h1 class="text-center mb-5 ">Form Validation with Regex</h1>
            <form>
                <div class="row mt-4">
                    <div class="col">
                        <input type="text" class="form-control" id="userName" placeholder="User Name">
                        <div class="invalid-feedback-user-name">
                        </div>
                    </div>
                </div>
                <div class="row mt-4">
                    <div class="col">
                        <input type="text" class="form-control" id="email" placeholder="Email">
                        <div class="invalid-feedback-email">
                        </div>
                    </div>
                </div>

                <div class="row mt-4">
                    <div class="col">
                        <input type="password" class="form-control" id="password" placeholder="Password">
                        <div class="invalid-feedback-password mt-2 ">
                        </div>
                    </div>
                </div>
                <div class="row mt-4">
                    <div class="col">
                        <input type="password" class="form-control" id="confirm-pass" placeholder="Confirm Password">
                        <div class="invalid-feedback-confirm-pass mt-2">
                        </div>
                    </div>
                </div>

                <div class="row mt-4">
                    <div class="col">
                        <input type="text" class="form-control" id="userName" placeholder="Phone Number">
                        <div class="invalid-feedback-user-name">
                        </div>
                    </div>
                </div>
                <button type="submit" class="btn btn-success btn-lg mt-3">Sign in</button>
            </form>
        </div>
    </div>
    <script src='main.js'></script>
</body>

</html>
